<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6E5E">
<title>Il mio piano</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E6E5E'/%3E%3Cpath d='M9 22V10m0 0c4 0 6 2 6 5s-2 5-6 5m9-10v12m0-6h5m-5-6h5' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ECEFE8; --surface:#FFFFFF; --surface-2:#F5F7F1;
    --ink:#1E2420; --muted:#6E7468; --faint:#9AA093; --line:#DCE1D4;
    --brand:#2E6E5E; --brand-d:#235448; --brand-soft:#E2EEEA;
    --pro:#A8553A; --carb:#C0851F; --fat:#5C7C3F;
    --gold:#B88A12; --gold-soft:#F7EFD7;
    --alert:#9E3B2E; --alert-soft:#FAEAE6;
    --r:16px; --r-sm:11px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --sh:0 1px 2px rgba(30,36,32,.05),0 6px 18px rgba(30,36,32,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    line-height:1.45; -webkit-font-smoothing:antialiased;
    padding:0 0 96px; min-height:100vh;
  }
  .wrap{max-width:580px; margin:0 auto; padding:0 16px}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

  /* Header */
  header{position:sticky; top:0; z-index:30; background:rgba(236,239,232,.86);
    backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line)}
  .head-in{max-width:580px; margin:0 auto; padding:14px 16px 0}
  .brandline{display:flex; align-items:center; gap:10px}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:0 0 auto}
  .mark svg{width:18px;height:18px}
  h1{font-size:18px; font-weight:680; margin:0; letter-spacing:-.015em}
  .sub{font-size:11.5px; color:var(--muted); margin-top:1px}
  .status{display:flex; gap:8px; margin:12px 0; overflow-x:auto; scrollbar-width:none}
  .status::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto; background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center}
  .pill b{color:var(--ink); font-weight:650}
  .pill .dot{width:7px;height:7px;border-radius:50%}
  /* Tabs */
  .tabs{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line);
    padding:4px; border-radius:13px; margin-bottom:14px}
  .tab{flex:1; border:0; background:transparent; font-family:inherit; font-size:13.5px; font-weight:560;
    color:var(--muted); padding:9px 0; border-radius:10px; cursor:pointer; transition:.15s}
  .tab[aria-selected="true"]{background:var(--surface); color:var(--brand-d); box-shadow:var(--sh)}

  main{padding-top:16px}
  .view{display:none; animation:fade .25s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Meal card */
  .meal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--sh); margin-bottom:12px; overflow:hidden}
  .meal-h{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none}
  .meal-h:hover{background:var(--surface-2)}
  .meal-ico{flex:0 0 auto; font-size:18px; width:26px; text-align:center}
  .meal-tt{flex:1; min-width:0}
  .meal-tt strong{font-size:15px; font-weight:640; display:block; letter-spacing:-.01em}
  .meal-tt span{font-size:11.5px; color:var(--faint); display:block; margin-top:1px}
  .chev{flex:0 0 auto; color:var(--faint); transition:transform .2s}
  .meal.open .chev{transform:rotate(180deg)}
  .meal-body{display:none; padding:0 16px 16px; border-top:1px solid var(--line)}
  .meal.open .meal-body{display:block}

  .col-lbl{display:flex; align-items:center; gap:7px; margin:16px 0 9px; font-size:11px;
    font-weight:700; letter-spacing:.07em; text-transform:uppercase}
  .col-lbl .sw{width:9px;height:9px;border-radius:3px}
  .col-lbl.pro{color:var(--pro)} .col-lbl.carb{color:var(--carb)} .col-lbl.fat{color:var(--fat)}
  .col-lbl.pro .sw{background:var(--pro)} .col-lbl.carb .sw{background:var(--carb)} .col-lbl.fat .sw{background:var(--fat)}

  .opts{display:flex; flex-wrap:wrap; gap:7px}
  .opt{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 11px;
    font-size:12.5px; cursor:pointer; transition:.12s; display:flex; align-items:center; gap:7px; line-height:1.25}
  .opt:hover{border-color:var(--faint)}
  .opt .g{font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .opt[aria-pressed="true"]{border-color:var(--brand); background:var(--brand-soft); color:var(--brand-d)}
  .opt[aria-pressed="true"] .g{color:var(--brand-d)}
  .opt .meat{font-size:11px;opacity:.85}
  .opt.x{font-size:12px;color:var(--muted)}

  .brocco{margin-top:9px; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted)}
  .brocco input{width:74px; font-family:var(--mono); font-size:13px; padding:6px 8px; border:1px solid var(--line);
    border-radius:8px; text-align:right}
  .brocco input:focus{outline:2px solid var(--brand-soft); border-color:var(--brand)}

  /* Scheda result */
  .scheda{margin-top:16px; background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:13px 14px}
  .scheda .sh-t{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:9px}
  .row{display:flex; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .tag{flex:0 0 auto; width:7px; height:7px; border-radius:2px; transform:translateY(4px)}
  .row.PRO .tag{background:var(--pro)} .row.CARB .tag{background:var(--carb)} .row.FAT .tag{background:var(--fat)}
  .row.ADD .tag{background:var(--brand)}
  .row .nm{flex:1; font-size:13px}
  .row .nm small{display:block; color:var(--faint); font-size:11px}
  .row .val{flex:0 0 auto; font-family:var(--mono); font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums}
  .row .val s{color:var(--faint); font-weight:400; margin-right:6px; text-decoration:line-through}
  .deltas{display:flex; flex-wrap:wrap; gap:5px; margin-top:3px}
  .delta{font-size:10.5px; color:var(--brand-d); background:var(--brand-soft); padding:2px 7px; border-radius:999px;
    font-family:var(--mono)}
  .note,.alert{margin-top:10px; font-size:12px; padding:9px 11px; border-radius:10px; line-height:1.4}
  .note{background:var(--gold-soft); color:#6a5310; border:1px solid #ecdfb6}
  .alert{background:var(--alert-soft); color:var(--alert); border:1px solid #f0cfc7; font-weight:520}
  .scheda.empty{color:var(--faint); font-size:12.5px; text-align:center; padding:18px}

  /* Fixed-protocol cards (pre/post workout) */
  .proto li{font-size:13px; padding:5px 0; display:flex; gap:9px; align-items:baseline}
  .proto li .b{font-family:var(--mono); color:var(--brand-d); font-weight:600; flex:0 0 auto}
  .proto ul{list-style:none; margin:8px 0 0; padding:0}

  /* Tracking */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh);
    padding:16px; margin-bottom:12px}
  .card h2{font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}
  .water-top{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:11px}
  .water-big{font-family:var(--mono); font-size:34px; font-weight:680; line-height:1; letter-spacing:-.03em}
  .water-big span{font-size:15px; color:var(--faint); font-weight:500}
  .water-sub{font-size:12px; color:var(--muted); text-align:right}
  .bar{height:9px; background:var(--surface-2); border:1px solid var(--line); border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,#3f8fd1,#5fb0e8); border-radius:99px; transition:width .3s}
  .wbtns{display:flex; gap:8px; margin-top:12px}
  .stepper{display:flex; align-items:center; gap:10px}
  .counter{display:flex; align-items:center; justify-content:space-between}
  .counter .cl{font-size:13.5px}
  .counter .cl small{display:block;color:var(--faint);font-size:11px;margin-top:1px}
  .cval{font-family:var(--mono); font-size:20px; font-weight:680; min-width:48px; text-align:center}
  .cval em{font-style:normal;color:var(--faint);font-size:14px}
  button.b{font-family:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:13px; font-weight:560; padding:9px 13px; transition:.12s}
  button.b:hover{background:var(--surface-2)}
  button.b:active{transform:scale(.97)}
  button.round{width:38px;height:38px;padding:0;font-size:18px;font-weight:600;display:grid;place-items:center;border-radius:11px}
  button.fill{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.fill:hover{background:var(--brand-d)}
  button.flex{flex:1}
  .toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .sw-tg{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
  .sw-tg::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
  .toggle[aria-checked="true"] .sw-tg{background:var(--brand)}
  .toggle[aria-checked="true"] .sw-tg::after{transform:translateX(19px)}
  .checklist{display:flex;flex-direction:column;gap:2px}
  .chk{display:flex;align-items:center;gap:11px;padding:9px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
  .chk:last-child{border-bottom:0}
  .box{width:21px;height:21px;border-radius:7px;border:1.8px solid var(--line);flex:0 0 auto;display:grid;place-items:center;transition:.12s}
  .chk[aria-checked="true"] .box{background:var(--brand);border-color:var(--brand)}
  .chk[aria-checked="true"] .box svg{opacity:1}
  .box svg{width:12px;height:12px;opacity:0}
  .chk .ck-l{font-size:13.5px;flex:1}
  .chk[aria-checked="true"] .ck-l{color:var(--muted);text-decoration:line-through}
  .progress-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .progress-h .d{font-family:var(--mono);font-size:15px;font-weight:640}
  .bar.b-brand i{background:linear-gradient(90deg,var(--brand),#4f9d87)}
  .banner{display:flex;gap:9px;align-items:flex-start;background:var(--gold-soft);border:1px solid #ecdfb6;
    color:#6a5310;border-radius:12px;padding:11px 13px;font-size:12.5px;margin-bottom:12px;line-height:1.4}
  .banner.warn{background:var(--alert-soft);border-color:#f0cfc7;color:var(--alert)}
  .banner b{font-weight:650}

  /* Rules */
  .rule-list{list-style:none;margin:0;padding:0}
  .rule-list li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.45}
  .rule-list li:last-child{border-bottom:0}
  .rule-list .ri{flex:0 0 auto;font-size:15px;width:22px;text-align:center}
  .legend{display:flex;flex-direction:column;gap:9px}
  .leg{display:flex;gap:10px;align-items:baseline;font-size:12.5px}
  .leg code{font-family:var(--mono);font-weight:700;flex:0 0 auto;min-width:30px}
  .leg .swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto;transform:translateY(2px)}
  .foot{text-align:center;font-size:11px;color:var(--faint);padding:8px 8px 0;line-height:1.5}
  .seed{display:flex;gap:8px;margin-top:4px}

  /* macro nel pasto */
  .macrobox{margin-top:11px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .mb-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .mb-lab{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .mb-kcal{font-size:18px;font-weight:680;letter-spacing:-.02em}
  .mb-kcal em{font-style:normal;font-size:12px;color:var(--faint);font-weight:500}
  .mb-grid{display:flex;gap:8px}
  .mb-cell{flex:1;background:var(--surface-2);border-radius:8px;padding:7px 6px;font-size:11px;color:var(--muted);text-align:center}
  .mb-cell b{display:block;font-size:15px;color:var(--ink);font-weight:680;margin-bottom:1px}
  .mb-dot{display:none}
  .mb-unc{font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.4}
  /* macro nel giorno */
  .day-kcal{font-size:32px;font-weight:680;line-height:1;letter-spacing:-.03em;margin-bottom:13px}
  .day-kcal span{font-size:14px;color:var(--faint);font-weight:500}
  .macrobar{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
  .macrobar i{display:block;height:100%;transition:width .3s}
  .macro-legend{display:flex;justify-content:space-between;margin-top:11px;gap:8px}
  .macro-legend span{font-size:11.5px;color:var(--muted)}
  .macro-legend b{display:block;font-size:16px;color:var(--ink);font-weight:680}
  .mb-foot{font-size:10.5px;color:var(--faint);margin-top:12px;line-height:1.4}
  /* editor valori */
  .nut-wrap{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
  .nlist{display:flex;flex-direction:column}
  .nrow{padding:9px 0;border-bottom:1px solid var(--line)}
  .nrow:last-child{border-bottom:0}
  .nname{font-size:12.5px;font-weight:560;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .approx{color:var(--gold);font-weight:700;cursor:help}
  .nscan{font-size:12px;cursor:help}
  .edited{color:var(--brand);font-size:16px;line-height:0}
  .nfields{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .nfields label{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;display:flex;flex-direction:column;gap:3px}
  .nfields input{font-family:var(--mono);font-size:13px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;width:100%;text-align:right;background:var(--surface-2)}
  .nfields input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);background:#fff}
  .prename{width:100%;font-family:var(--sans);font-size:14px;font-weight:560;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
  .prename:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);background:#fff}

  /* euro */
  .mb-eur{font-family:var(--mono);font-size:13px;font-weight:680;color:var(--brand-d);margin-right:10px}
  .mb-eur em{font-style:normal;color:var(--faint)}
  .day-eur{font-size:13px;color:var(--muted);margin-top:11px}
  .day-eur b{font-family:var(--mono);color:var(--brand-d);font-weight:680;font-size:15px}
  .faintnote{color:var(--faint);font-size:11px}

  /* spesa */
  .plist{display:flex;flex-direction:column;gap:2px}
  .prow{padding:11px 0;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow-top{display:flex;align-items:center;gap:11px}
  .pcheck{flex:0 0 auto;cursor:pointer}
  .pcheck .box{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line);display:grid;place-items:center;transition:.12s}
  .pcheck .box svg{width:12px;height:12px;opacity:0}
  .pcheck[aria-checked="true"] .box{background:var(--brand);border-color:var(--brand)}
  .pcheck[aria-checked="true"] .box svg{opacity:1}
  .pname-wrap{flex:1;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
  .pname{font-size:14px;font-weight:550}
  .badge-plan{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brand-d);background:var(--brand-soft);padding:2px 7px;border-radius:999px}
  .pdel{flex:0 0 auto;border:0;background:transparent;color:var(--faint);font-size:15px;cursor:pointer;padding:4px 6px;border-radius:8px}
  .pdel:hover{background:var(--alert-soft);color:var(--alert)}
  .prow-bot{display:flex;align-items:center;gap:10px;margin-top:9px;padding-left:33px;flex-wrap:wrap}
  .pfields{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pf{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;display:flex;flex-direction:column;gap:3px}
  .pf input{width:72px;font-family:var(--mono);font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right;background:var(--surface-2)}
  .pf input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);background:#fff}
  .per100{font-family:var(--mono);font-size:12px;color:var(--brand-d);font-weight:600}
  .pscan{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;cursor:pointer;padding:6px 8px}
  .pscan:hover{background:var(--surface-2)}
  .pscan.cart.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-d)}
  .pscan:disabled{cursor:default}
  .scanned{flex-basis:100%;font-size:11px;color:var(--faint);margin-top:2px}
  /* overlay scansione */
  .scan-ov{position:fixed;inset:0;z-index:100;background:rgba(20,24,20,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px}
  .scan-card{background:var(--surface);border-radius:18px;max-width:420px;width:100%;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.32)}
  .scan-h{display:flex;justify-content:space-between;align-items:center;font-size:16px}
  .scan-x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--muted)}
  .scan-sub{font-size:13px;color:var(--muted);margin:2px 0 12px}
  .scan-cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
  .scan-cam video{width:100%;height:100%;object-fit:cover}
  .scan-frame{position:absolute;inset:20% 12%;border:2px solid rgba(255,255,255,.85);border-radius:10px}
  .scan-noc{color:#cfd3cb;font-size:13px;text-align:center;padding:24px;line-height:1.5}
  .scan-msg{font-size:12.5px;color:var(--brand-d);min-height:18px;margin:11px 2px;line-height:1.4}
  .scan-manual{display:flex;gap:8px;margin-top:2px}
  .scan-manual input{flex:1;font-family:var(--mono);font-size:14px;padding:10px 11px;border:1px solid var(--line);border-radius:10px}
  .scan-manual input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  /* prodotti scansionati */
  .prodlist{display:flex;flex-direction:column;gap:12px}
  .prodrow{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:var(--surface-2)}
  .prod-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .prod-name{font-size:14.5px;font-weight:650;line-height:1.25}
  .prod-name small{display:block;font-size:11.5px;color:var(--faint);font-weight:500;margin-top:1px}
  .prod-name.big{font-size:17px}
  .prod-badges{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}
  .qbadge{font-size:10.5px;font-weight:700;color:#fff;padding:3px 9px;border-radius:999px;letter-spacing:.01em}
  .qbadge.off{background:var(--faint)}
  .prod-macros{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;font-size:11.5px;color:var(--muted)}
  .prod-macros b{font-size:15px;color:var(--ink);font-weight:680;margin-right:3px}
  .prod-macros em{font-style:normal;color:var(--faint);font-size:10.5px}
  .prod-actions{display:flex;gap:8px;margin-top:11px}
  .search-in{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;background:var(--surface);color:var(--ink);box-sizing:border-box}
  .search-in:focus{outline:none;border-color:var(--brand)}

function sumMacro(list){
  const t={kcal:0,p:0,c:0,f:0};
  (list||[]).forEach(it=>{ const n=nutrOf(it.mid), k=it.mg/100;

  if(!s.today) s.today = {sel:{}};
  if(!s.today.sel || !Object.keys(s.today.sel).length) s.today.sel = clone(presetById(s.activeId, s).sel);
  if(!s.pantry || !s.pantry.length) s.pantry = seedPantry();
  if(!(s.pantry||[]).some(p=>p.cat==="frutta")) s.pantry = s.pantry.concat(seedProduce());
  if(!(s.pantry||[]).some(p=>p.cat==="carbo")) s.pantry = s.pantry.concat(seedCarbs());
  if(!(s.pantry||[]).some(p=>p.cat==="fruttasecca")) s.pantry = s.pantry.concat(seedNuts());
  // fold prodotti scansionati (vecchio S.scanned) dentro la libreria unica
  if(Array.isArray(s.scanned) && s.scanned.length){
    s.scanned.forEach(sc=>{
      let it=(s.pantry||[]).find(p=>p.ean && p.ean===sc.ean);
      if(!it){ it={id:genId(), nome:sc.name||"Prodotto", foodId:null, cat:"scansionato", ho:false, prezzo:+sc.prezzo||0, gConf:sc.qty||0, note:"", disp:false, ean:sc.ean}; s.pantry.push(it); }
      it.brand=sc.brand||it.brand||""; it.nutri=sc.nutri||it.nutri||null; it.nova=sc.nova||it.nova||null;
      it.m100={kcal:sc.kcal,p:sc.p,c:sc.c,f:sc.f}; if(sc.qty&&!it.gConf) it.gConf=sc.qty;
    });
    s.scanned=[];
  }
  s.pantry.forEach(p=>{
    if(!p.cat) p.cat = p.foodId?"piano":"altro";
    if(p.disp===undefined) p.disp = (p.cat==="piano"||p.cat==="altro");
  });
  if(!Array.isArray(s.scanned)) s.scanned=[];
  if(!Array.isArray(s.shopping)) s.shopping=[];
  // materializza TUTTI i macro nel JSON (riempie i mancanti, preserva le modifiche)
  s.nutr = s.nutr || {};
  NUTR_IDS.forEach(id=>{ const b=NUTR_BASE[id];
    if(!s.nutr[id]) s.nutr[id]={kcal:b.kcal,p:b.p,c:b.c,f:b.f};
    else ["kcal","p","c","f"].forEach(k=>{ if(s.nutr[id][k]==null) s.nutr[id][k]=b[k]; });
  });
  return s;
}

function computeMeal(m){
  const s=selOf(m), cfg=CARBO[m], gl=GRASSI[m];
  const p=(PRO[m]).find(x=>x.id===s.pro);
  const tags=p?(p.tags||[]):[];
  const out={rows:[], notes:[], alerts:[], macro:[], uncounted:[]};

  if(p){
    out.rows.push({c:"PRO", nm:p.nome, sub:p.extra||"", val: p.g!=null ? p.g+" g" : p.unit});
    const pm=proMacro(m,p); out.macro.push(...pm.macro); out.uncounted.push(...pm.unc);
  }

  /* CARBO */
  if(s.carbo==="patate" && cfg.patate){
    let g=cfg.patate, d=[];
    if(tags.includes("magro")){ g-=cfg.patateMagro; d.push("−"+cfg.patateMagro+" magra"); }
    g=Math.max(0,g);
    out.rows.push({c:"CARB", nm:"Patate dolci", base:cfg.patate, val:g+" g", d});
    out.macro.push({mid:"patate",mg:g});
    if(s.broccoli>0) out.macro.push({mid:"broccoli",mg:s.broccoli});
    if(tags.includes("edamame")) out.notes.push("Con edamame il piano toglie 40g dalle fonti secche: con le patate dolci valuta a mano.");
    if(s.broccoli>0) out.notes.push("Broccoli: 200g = 20g di fonti glucidiche (regola riferita alle fonti secche).");
  } else if(s.carbo==="secche"){
    let g=cfg.secche, d=[];
    if(tags.includes("magro")){ g-=cfg.magroSecche; d.push("−"+cfg.magroSecche+" magra"); }
    if(tags.includes("bar") && cfg.barSecche){ g-=cfg.barSecche; d.push("−"+cfg.barSecche+" barretta"); }
    if(tags.includes("edamame")){ g-=40; d.push("−40 edamame"); }
    if(s.broccoli>0){ const r=Math.round(s.broccoli/200*20); g-=r; d.push("−"+r+" broccoli"); }
    g=Math.max(0,g);
    out.rows.push({c:"CARB", nm:"Fonti glucidiche secche integrali", base:cfg.secche, val:g+" g", d});
    out.macro.push({mid:"secche",mg:g});
    if(s.broccoli>0) out.macro.push({mid:"broccoli",mg:s.broccoli});
  }
  if(cfg.verdure) out.notes.push("+ Verdure cotte o crude a volontà · 200g broccoli = 20g di fonti glucidiche da scalare.");

  /* GRASSI */
  if(tags.includes("bar")){
    out.notes.push("Perfect Bar: non aggiungere grassi extra da questa colonna.");
  } else if(tags.includes("tofu")){
    out.alerts.push("Tofu → escludi i grassi extra GIORNALIERI (corrispondenti a #40 / *20). Qui azzerati.");
  } else if(tags.includes("salmone")){
    out.alerts.push("Salmone → togli #40 (oppure *20) dalla quota grassi GIORNALIERA. Qui azzerati.");
  } else if(s.grassi!=null && gl[s.grassi]){
    const f=gl[s.grassi]; let d=[]; let valTxt = f.cucchiaio ? "1 cucchiaio" : f.g+" g"; let base = f.cucchiaio ? null : f.g;
    let red=0;
    if(m!=="colazione"){
      if(tags.includes("fatHigh")) red = f.sym==="#"?20:10;
      else if(tags.includes("fatLow")) red = f.sym==="#"?10:5;
      if(red>0){
        if(f.cucchiaio){ d.push("−"+red+"g regola "+f.sym); }
        else { valTxt = Math.max(0,f.g-red)+" g"; d.push("−"+red+" proteica"); }
      }
    }
    out.rows.push({c:"FAT", nm:f.sym+" "+f.nome, base, val:valTxt, d});
    const fg = f.cucchiaio ? Math.max(0,10-red) : Math.max(0,f.g-red);
    out.macro.push({mid:FAT_ID[m][s.grassi], mg:fg});
  }
  return out;
}

function computePost(){
  const s=selOf("postworkout");
  const PW=[
    {id:"whey",   nome:"Whey protein concentrate", g:40},
    {id:"dessert",nome:"Dessert proteico Milbona", g:320, riso:25},
    {id:"yogurt", nome:"Yogurt greco 0% bianco", g:300, riso:20},
    {id:"quark",  nome:"Quark magro", g:275, riso:20},
    {id:"mozza",  nome:"High protein mozzarella Lidl", g:140},
  ];
  const p=PW.find(x=>x.id===s.pwPro);
  const riso = 70 - (p && p.riso ? p.riso : 0);
  const macro=[], unc=[];
  if(p){ macro.push({mid:p.id,mg:p.g}); macro.push({mid:"risobianco",mg:riso}); unc.push("1 frutto di stagione"); }
  return {PW, p, riso, macro, unc};
}
/* macro totali della giornata (pasti con almeno una scelta) */
function dailyMacro(){
  CTX={kind:"today"};
  let macro=[], unc=[];
  STD_MEALS.forEach(m=>{ const s=selOf(m); if(s.pro||s.carbo){ const r=computeMeal(m); macro.push(...r.macro); unc.push(...r.uncounted); }});
  if(selOf("postworkout").pwPro){ const r=computePost(); macro.push(...r.macro); unc.push(...r.unc); }
  return {t:sumMacro(macro), unc:[...new Set(unc)], any:macro.length>0, cost:listCost(macro)};
}

function nutriBadge(g){ if(!g||!NUTRI[g]) return `<span class="qbadge off">Nutri-Score n/d</span>`;

function qualityNote(d){
  const bits=[];
  if(d.nutri&&NUTRI[d.nutri]) bits.push(`qualità nutrizionale <b>${NUTRI[d.nutri][0].toLowerCase()}</b> (Nutri-Score ${d.nutri})`);

function rowMacros(it){
  const m = it.foodId ? nutrOf(it.foodId) : it.m100;

  return `<div class="disp-macros"><span><b class="num">${m.kcal!=null?Math.round(m.kcal):'–'}</b> kcal</span><span><b class="num">${fmt(m.p)}</b> P</span><span><b class="num">${fmt(m.c)}</b> C</span><span><b class="num">${fmt(m.f)}</b> G</span><em>/100g</em></div>`;
}
function addToDispensa(it){ if(it){ it.disp=true; } }
function inShopping(it){ return (S.shopping||[]).some(l=>(l.pantryId&&l.pantryId===it.id)||(l.ean&&it.ean&&l.ean===it.ean)); }
function addToShopping(it){
  if(!Array.isArray(S.shopping)) S.shopping=[];
  if(inShopping(it)) return;
  S.shopping.push({id:genId(), name:it.nome, prezzo:+it.prezzo||0, done:false, ean:it.ean||null, pantryId:it.id});
}
/* prezzo effettivo di una voce in lista: dal vivo dal prodotto in libreria, altrimenti manuale */
function linePrice(line){
  if(line.pantryId){ const p=(S.pantry||[]).find(x=>x.id===line.pantryId); if(p && +p.prezzo>0) return +p.prezzo; }
  if(line.ean){ const d=(S.pantry||[]).find(x=>x.ean===line.ean && +x.prezzo>0); if(d) return +d.prezzo; }
  return +line.prezzo||0;
}
/* scrive il prezzo su UN solo prodotto logico: stesso EAN o stesso id ovunque */
function setPrice(ref, value){
  value=+value||0; let ean=ref.ean;
  if(ref.pantryId){ const p=(S.pantry||[]).find(x=>x.id===ref.pantryId); if(p){ p.prezzo=value; if(p.ean) ean=p.ean; } }
  if(ean){ (S.pantry||[]).forEach(p=>{ if(p.ean===ean) p.prezzo=value; }); }
}
function macroVals(it){ return it.foodId ? nutrOf(it.foodId) : (it.m100||{kcal:null,p:null,c:null,f:null}); }
function catOf(it){ return it.cat || (it.foodId?"piano":"altro"); }
function dispCmp(a,b,s){
  const ma=macroVals(a), mb=macroVals(b);
  if(s==="kcal") return (ma.kcal??1e9)-(mb.kcal??1e9);
  if(s==="p") return (mb.p??-1)-(ma.p??-1);
  if(s==="c") return (mb.c??-1)-(ma.c??-1);
  if(s==="f") return (mb.f??-1)-(ma.f??-1);
  return (a.nome||"").localeCompare(b.nome||"");
}

function macroLine(m){ return `<div class="prod-macros"><span><b class="num">${m.kcal!=null?Math.round(m.kcal):'–'}</b> kcal</span><span><b class="num">${fmt(m.p)}</b> P</span><span><b class="num">${fmt(m.c)}</b> C</span><span><b class="num">${fmt(m.f)}</b> G</span><em>/100g</em></div>`; }
function libFilterSort(arr, filt, sort, q){

function macroBlock(macro,unc,label){
  if(!macro || !macro.length) return "";

  const c=listCost(macro);
  const cost = c.any ? `<span class="mb-eur num">≈€${c.tot.toFixed(2)}${c.partial?'<em>+</em>':''}</span>` : "";
  const u = (unc&&unc.length)? `<div class="mb-unc">+ ${unc.join(", ")} (non conteggiati)</div>` : "";
  return `<div class="macrobox">
    <div class="mb-top"><span class="mb-lab">${label||"Totale pasto"}</span><span>${cost}<span class="mb-kcal num">${Math.round(t.kcal)}<em> kcal</em></span></span></div>
    <div class="mb-grid">
      <div class="mb-cell"><span class="mb-dot" style="background:var(--pro)"></span><b class="num">${t.p.toFixed(0)}</b> P</div>
      <div class="mb-cell"><span class="mb-dot" style="background:var(--carb)"></span><b class="num">${t.c.toFixed(0)}</b> C</div>
      <div class="mb-cell"><span class="mb-dot" style="background:var(--fat)"></span><b class="num">${t.f.toFixed(0)}</b> G</div>
    </div>${u}</div>`;
}

function buildBody(m){
  if(m==="preworkout") return el(`<div class="meal-body-in proto">
    <div class="col-lbl" style="color:var(--brand)"><span class="sw" style="background:var(--brand)"></span>Integrazione pre-workout</div>

        <li><span class="b">+4</span> BCAA</li>
        <li><span class="b">+1 g</span> acetil-carnitina</li></ul></div>`);

  if(m==="postworkout"){
    const {PW,p,riso,macro,unc}=computePost();
    const opts = PW.map(x=>chip(x.nome,x.g+" g", p&&p.id===x.id, `data-pw="${x.id}"`)).join("");
    const wrap=el(`<div class="meal-body-in">
      <div class="col-lbl pro"><span class="sw"></span>Proteica</div>
      <div class="opts">${opts}</div>
      <div class="scheda"><div class="sh-t">Da assumere</div>
        <div class="row ADD"><span class="tag"></span><span class="nm">${p?p.nome:"— scegli la proteica —"}</span><span class="val">${p?p.g+" g":""}</span></div>
        <div class="row ADD"><span class="tag"></span><span class="nm">+ Riso bianco / gallette / crema di riso${p&&p.riso?`<small>−${p.riso}g per l’opzione scelta</small>`:""}</span><span class="val">${riso} g</span></div>
        <div class="row ADD"><span class="tag"></span><span class="nm">+ 1 frutto di stagione<small>oppure 2× purea di frutta</small></span><span class="val"></span></div>
        <div class="row ADD"><span class="tag"></span><span class="nm">+ BCAA + ½ multivitaminico</span><span class="val">3</span></div>
        ${macroBlock(macro,unc)}
      </div></div>`);
    return wrap;
  }

  // pasti standard
  const s=selOf(m), cfg=CARBO[m], gl=GRASSI[m];
  const proOpts = PRO[m].map(p=>{
    const meat = (p.tags||[]).includes("rosso") ? `<span class="meat">🥩</span>` : "";
    return chip(p.nome+meat, p.g!=null?p.g+" g":p.unit, s.pro===p.id, `data-pro="${p.id}"`);
  }).join("");

  let carbHtml = chip("Fonti secche integrali", cfg.secche+" g", s.carbo==="secche", `data-carbo="secche"`);
  if(cfg.patate) carbHtml += chip("Patate dolci", cfg.patate+" g", s.carbo==="patate", `data-carbo="patate"`);
  carbHtml += chip("Nessuno", "", !s.carbo, `data-carbo=""`, "x");

  const fatOpts = gl.map((f,i)=>chip(f.sym+" "+f.nome, f.cucchiaio?"1 cucch.":f.g+" g", s.grassi===i, `data-grassi="${i}"`)).join("")
    + chip("Nessuno", "", s.grassi==null, `data-grassi="null"`, "x");

  const r=computeMeal(m);
  const rowsHtml = r.rows.map(row=>{
    const base = (row.base!=null && row.d && row.d.length) ? `<s>${row.base} g</s>` : "";
    const dd = (row.d&&row.d.length)?`<div class="deltas">${row.d.map(x=>`<span class="delta">${x}</span>`).join("")}</div>`:"";
    return `<div class="row ${row.c}"><span class="tag"></span><span class="nm">${row.nm}${row.sub?`<small>${row.sub}</small>`:""}${dd}</span><span class="val">${base}${row.val}</span></div>`;
  }).join("");
  const notes = r.notes.map(n=>`<div class="note">${n}</div>`).join("");
  const alerts = r.alerts.map(n=>`<div class="alert">⚠️ ${n}</div>`).join("");
  const empty = r.rows.length? "" : "empty";
  const schedaInner = r.rows.length ? `<div class="sh-t">La tua scheda</div>${rowsHtml}${alerts}${notes}${macroBlock(r.macro,r.uncounted)}`
                                     : `Scegli gli alimenti qui sopra per comporre il pasto`;

  const broccoVal = s.broccoli>0 ? s.broccoli : "";
  const broccoHtml = cfg.verdure ? `<div class="brocco">🥦 Broccoli <input type="number" min="0" step="50" placeholder="0" value="${broccoVal}" data-brocco="${m}"> g</div>` : "";

  return el(`<div class="meal-body-in">
    <div class="col-lbl pro"><span class="sw"></span>Proteine</div><div class="opts">${proOpts}</div>
    <div class="col-lbl carb"><span class="sw"></span>Carboidrati</div><div class="opts">${carbHtml}</div>${broccoHtml}

    <div class="scheda ${empty}">${schedaInner}</div>
  </div>`);
}

document.addEventListener("click", e=>{
  const t=e.target.closest("[data-toggle],[data-view],[data-pro],[data-carbo],[data-grassi],[data-pw],[data-water],[data-free],[data-red],[data-done],[data-loadtoday],[data-editpreset],[data-addpreset],[data-delpreset],[data-stab],[data-pho],[data-pcart],[data-pscan],[data-scanopen],[data-tolist],[data-todisp],[data-prodremove],[data-dispremove],[data-dispadd],[data-prodfilter],[data-prodsort],[data-dispfilter],[data-dispsort],[data-ldone],[data-ldel],[data-ladd],[data-lclear],[data-scanclose],[data-scanlookup],[data-scanapply],[data-scanadd],[data-scanagain],[data-export],[data-import],#setStart,#resetStart,#newDay,#restToggle,#nutToggle,#nutReset");
  if(!t) return;

  if(t.dataset.view){ switchView(t.dataset.view); return; }

  // toggle apertura pasto (scoped al contesto della card)
  if(t.dataset.toggle){
    const card=t.closest(".meal"); CTX=ctxOf(card);
    const m=t.dataset.toggle, key=card.dataset.ctx+":"+m, b=card.querySelector(".meal-body");
    if(openMeals.has(key)){ openMeals.delete(key); card.classList.remove("open"); b.innerHTML=""; }
    else { openMeals.add(key); card.classList.add("open"); b.innerHTML=""; b.appendChild(buildBody(m)); }
    return;
  }

  // selezioni pasto (proteine/carbo/grassi/postworkout)
  if(t.dataset.pro!==undefined){ const card=t.closest(".meal"); CTX=ctxOf(card); const m=card.dataset.meal; const s=selOf(m); s.pro=s.pro===t.dataset.pro?null:t.dataset.pro; applyMeal(card,m); return; }
  if(t.dataset.carbo!==undefined){ const card=t.closest(".meal"); CTX=ctxOf(card); const m=card.dataset.meal; selOf(m).carbo=t.dataset.carbo||null; applyMeal(card,m); return; }
  if(t.dataset.grassi!==undefined){ const card=t.closest(".meal"); CTX=ctxOf(card); const m=card.dataset.meal; selOf(m).grassi=t.dataset.grassi==="null"?null:+t.dataset.grassi; applyMeal(card,m); return; }
  if(t.dataset.pw!==undefined){ const card=t.closest(".meal"); CTX=ctxOf(card); const s=selOf("postworkout"); s.pwPro=s.pwPro===t.dataset.pw?null:t.dataset.pw; applyMeal(card,"postworkout"); return; }

  // preset
  if(t.dataset.loadtoday){ S.activeId=t.dataset.loadtoday; S.today.sel=clone(presetById(t.dataset.loadtoday).sel); save(); switchView("oggi"); renderStatus(); return; }
  if(t.dataset.editpreset){ S.editingId=t.dataset.editpreset; save(); renderPreset(); return; }
  if(t.dataset.addpreset!==undefined){ const id=genId(); S.presets.push({id, name:"Giornata "+String.fromCharCode(65+(S.presets.length%26)), sel:{}}); S.editingId=id; save(); renderPreset(); return; }
  if(t.dataset.delpreset){ if(S.presets.length<=1) return; const id=t.dataset.delpreset; S.presets=S.presets.filter(p=>p.id!==id);
    if(S.editingId===id) S.editingId=S.presets[0].id; if(S.activeId===id) S.activeId=S.presets[0].id; save(); renderPreset(); renderOggi(); renderStatus(); return; }

  // spesa: tab + dispensa
  if(t.dataset.stab){ S.spesaTab=t.dataset.stab; save(); renderSpesa(); return; }
  if(t.dataset.pho){ const it=S.pantry.find(x=>x.id===t.dataset.pho); if(it){ it.ho=!it.ho; save(); renderSpesa(); renderStatus(); } return; }
  if(t.dataset.pcart){ const it=S.pantry.find(x=>x.id===t.dataset.pcart); if(it){ addToShopping(it); save(); renderSpesa(); } return; }
  if(t.dataset.pdel){ S.pantry=S.pantry.filter(x=>x.id!==t.dataset.pdel); save(); renderSpesa(); renderStatus(); return; }
  if(t.dataset.pscan){ openScan("plan", t.dataset.pscan); return; }

  // catalogo / dispensa (libreria unica S.pantry)
  if(t.dataset.scanopen!==undefined){ openScan("catalog"); return; }
  if(t.dataset.tolist){ const it=S.pantry.find(x=>x.id===t.dataset.tolist); if(it){ addToShopping(it); save(); renderSpesa(); } return; }
  if(t.dataset.todisp){ const it=S.pantry.find(x=>x.id===t.dataset.todisp); if(it){ addToDispensa(it); save(); renderSpesa(); renderStatus(); } return; }
  if(t.dataset.dispadd){ const it=S.pantry.find(x=>x.id===t.dataset.dispadd); if(it){ it.disp=true; dispQuery=""; save(); renderSpesa(); renderStatus(); } return; }
  if(t.dataset.dispremove){ const it=S.pantry.find(x=>x.id===t.dataset.dispremove); if(it){ it.disp=false; save(); renderSpesa(); renderStatus(); } return; }
  if(t.dataset.prodremove){ const id=t.dataset.prodremove; const it=S.pantry.find(x=>x.id===id);
    S.pantry=S.pantry.filter(x=>x.id!==id);
    S.shopping=(S.shopping||[]).filter(l=> l.pantryId!==id && (!it||!it.ean||l.ean!==it.ean));
    save(); renderSpesa(); renderStatus(); return; }
  if(t.dataset.prodfilter){ S.prodFilter=t.dataset.prodfilter; save(); renderSpesa(); return; }
  if(t.dataset.prodsort){ S.prodSort=t.dataset.prodsort; save(); renderSpesa(); return; }
  if(t.dataset.dispfilter){ S.dispFilter=t.dataset.dispfilter; save(); renderSpesa(); return; }
  if(t.dataset.dispsort){ S.dispSort=t.dataset.dispsort; save(); renderSpesa(); return; }

  // lista spesa
  if(t.dataset.ldone){ const it=(S.shopping||[]).find(x=>x.id===t.dataset.ldone); if(it){ it.done=!it.done;
    if(it.done){ const pit=(S.pantry||[]).find(p=>(it.pantryId&&p.id===it.pantryId)||(it.ean&&p.ean&&p.ean===it.ean)); if(pit) pit.ho=true; }
    save(); renderSpesa(); renderStatus(); } return; }
  if(t.dataset.ldel){ S.shopping=(S.shopping||[]).filter(x=>x.id!==t.dataset.ldel); save(); renderSpesa(); return; }
  if(t.dataset.lclear!==undefined){ S.shopping=(S.shopping||[]).filter(x=>!x.done); save(); renderSpesa(); return; }
  if(t.dataset.ladd!==undefined){ if(!Array.isArray(S.shopping)) S.shopping=[]; S.shopping.push({id:genId(), name:"", prezzo:0, done:false}); save(); renderSpesa(); return; }

  // scansione: card di conferma
  if(t.dataset.scanapply!==undefined){ const ov=document.getElementById("scanOv"); if(ov&&scanResult){ applyScan(ov.dataset.ref, scanResult.data, scanResult.ean); } closeScan(); S.spesaTab="dispensa"; renderSpesa(); return; }
  if(t.dataset.scanadd){ if(scanResult){ addScanned(scanResult.data, scanResult.ean, t.dataset.scanadd==="disp"); } closeScan(); S.spesaTab=(t.dataset.scanadd==="disp")?"dispensa":"prodotti"; renderSpesa(); return; }
  if(t.dataset.scanagain!==undefined){ const ov=document.getElementById("scanOv"); const m=ov?ov.dataset.mode:"catalog", r=ov?ov.dataset.ref:null; closeScan(); openScan(m, r); return; }
  if(t.dataset.scanclose!==undefined){ closeScan(); return; }
  if(t.dataset.scanlookup!==undefined){ const inp=document.getElementById("scanEan"); if(inp) lookup(inp.value); return; }

  // tracking
  if(t.dataset.water){ S.water=Math.max(0,S.water+ +t.dataset.water); save(); renderStatus(); renderOggi(); return; }
  if(t.dataset.free){ S.freeMeals=Math.max(0,S.freeMeals+ +t.dataset.free); save(); renderStatus(); renderOggi(); return; }
  if(t.dataset.red){ S.redMeat=Math.max(0,S.redMeat+ +t.dataset.red); save(); renderOggi(); return; }
  if(t.dataset.done!==undefined){ const m=t.dataset.done; S.done[m]=!S.done[m]; save(); renderOggi(); return; }

  if(t.id==="restToggle"){ S.restDay=!S.restDay; save(); renderOggi(); return; }
  if(t.id==="setStart"){ S.startDate=todayStr(); save(); render(); return; }
  if(t.id==="resetStart"){ S.startDate=todayStr(); save(); render(); return; }
  if(t.id==="newDay"){ S.water=0; S.done={}; save(); render(); return; }
  if(t.id==="nutToggle"){ nutOpen=!nutOpen; renderOggi(); return; }
  if(t.id==="nutReset"){ S.nutr=seedNutr(); save(); renderStatus(); renderOggi(); return; }
  if(t.dataset.export!==undefined){ exportData(); return; }
  if(t.dataset.import!==undefined){ const f=document.getElementById("importFile"); if(f) f.click(); return; }
});

    return;

  if(t.dataset && (t.dataset.pprice||t.dataset.pgrams)){

    if(t.dataset.pprice) setPrice({pantryId:it.id, ean:it.ean}, t.value); else it.gConf=+t.value||0;

  }

  if(t.dataset && t.dataset.lname){ const it=(S.shopping||[]).find(x=>x.id===t.dataset.lname); if(it){ it.name=t.value; save(); } return; }
  if(t.dataset && t.dataset.lprice){ const it=(S.shopping||[]).find(x=>x.id===t.dataset.lprice); if(it){
    if(it.pantryId||it.ean) setPrice({pantryId:it.pantryId, ean:it.ean}, t.value); else it.prezzo=+t.value||0;
    save();
    const totAll=(S.shopping||[]).reduce((a,x)=>a+linePrice(x),0);
    const h=document.getElementById("listaTot"); if(h) h.textContent=`≈€${totAll.toFixed(2)}`; }
    return; }
  if(t.dataset && t.dataset.prodsearch!==undefined){ prodQuery=t.value; const l=document.getElementById("prodList"); if(l) l.innerHTML=prodRows(); return; }
  if(t.dataset && t.dataset.dispsearch!==undefined){ dispQuery=t.value; const a=document.getElementById("dispAdd"); if(a) a.innerHTML=dispAddRows(); return; }
  if(t.dataset && t.dataset.nut){
    const id=t.dataset.nut, k=t.dataset.k;
    if(!S.nutr) S.nutr={};
    if(!S.nutr[id]) S.nutr[id]={};
    if(t.value==="") delete S.nutr[id][k]; else S.nutr[id][k]=+t.value;
    if(Object.keys(S.nutr[id]).length===0) delete S.nutr[id];
    save();
    renderStatus();
    const mc=document.getElementById("macroCard"); if(mc) mc.innerHTML=macroCardInner();
  }
});

function parseOFF(json){
  if(!json || json.status!==1 || !json.product) return null;
  const p=json.product, n=p.nutriments||{};
  const num=v=>(v==null||v===""||isNaN(+v))?null:+v;
  const grade=(typeof p.nutriscore_grade==="string" && /^[a-e]$/i.test(p.nutriscore_grade)) ? p.nutriscore_grade.toUpperCase() : null;
  return { name:p.product_name||"", brand:(p.brands||"").split(",")[0].trim(),
           kcal:num(n["energy-kcal_100g"]), p:num(n["proteins_100g"]),
           c:num(n["carbohydrates_100g"]), f:num(n["fat_100g"]), qty:num(p.product_quantity),
           nutri:grade, nova:[1,2,3,4].includes(+p.nova_group)?+p.nova_group:null };
}
function applyScan(itemId, d, ean){
  const it=S.pantry.find(x=>x.id===itemId); if(!it) return;
  it.ean=ean; if(d.name) it.scannedName=d.name; if(d.brand) it.brand=d.brand;
  if(d.qty) it.gConf=d.qty;
  if(it.foodId){
    if(!S.nutr) S.nutr={};
    const o={...(S.nutr[it.foodId]||{})};
    if(d.kcal!=null)o.kcal=Math.round(d.kcal); if(d.p!=null)o.p=d.p; if(d.c!=null)o.c=d.c; if(d.f!=null)o.f=d.f;
    S.nutr[it.foodId]=o;
  }
  save(); renderSpesa(); renderStatus();
}
let scanStream=null, scanRAF=null, scanBusy=false;
let scanResult=null;
function openScan(mode, ref){
  const titleName = mode==="plan" ? planName(ref) : null;
  const hasBD=("BarcodeDetector" in window);
  const fileMode=(location.protocol==="file:");
  const canCam = hasBD && !fileMode && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  const camHtml = canCam
    ? `<video id="scanVid" playsinline muted></video><div class="scan-frame"></div>`
    : `<div class="scan-noc">${fileMode
        ? "📷 File aperto in locale: Chrome blocca la fotocamera. Usa il codice manuale qui sotto. Per la scansione dal vivo pubblica il file (es. GitHub Pages)."
        : (hasBD ? "📷 Fotocamera non disponibile qui. Inserisci il codice a mano."
                 : "📷 Scansione live non supportata su questo browser (tipico su iPhone). Inserisci il codice a mano.")}</div>`;
  const ov=el(`<div class="scan-ov" id="scanOv">
    <div class="scan-card">
      <div class="scan-h"><b>${mode==="plan"?"Riempi: "+escapeHtml(titleName):"Scansiona prodotto"}</b><button class="scan-x" data-scanclose>✕</button></div>
      <div id="scanScan">
        <div class="scan-cam" id="scanCam">${camHtml}</div>
        <div class="scan-msg" id="scanMsg"></div>
        <div class="scan-manual">
          <input id="scanEan" type="text" inputmode="numeric" placeholder="Codice a barre (EAN)">
          <button class="b fill" data-scanlookup>Cerca</button>
        </div>
        <div class="mb-foot">Nutrienti e indici da Open Food Facts: serve internet, solo prodotti confezionati. Il prezzo resta manuale.</div>
      </div>
      <div id="scanResult"></div>
    </div></div>`);
  ov.dataset.mode=mode; if(ref) ov.dataset.ref=ref;
  document.body.appendChild(ov);
  if(canCam) startScan(ref);
  else setTimeout(()=>{ const i=document.getElementById("scanEan"); if(i) i.focus(); }, 60);
}
async function startScan(){
  const vid=document.getElementById("scanVid"); const msg=document.getElementById("scanMsg"); if(!vid) return;
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    vid.srcObject=scanStream; await vid.play();
    const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
    const tick=async()=>{
      if(!scanStream) return;
      if(!scanBusy){ scanBusy=true;
        try{ const codes=await det.detect(vid); if(codes&&codes.length){ scanBusy=false; lookup(codes[0].rawValue); return; } }catch(e){}
        scanBusy=false;
      }
      scanRAF=requestAnimationFrame(tick);
    };
    scanRAF=requestAnimationFrame(tick);
  }catch(e){
    const cam=document.getElementById("scanCam");
    if(cam) cam.innerHTML='<div class="scan-noc">📷 Permesso fotocamera negato o non disponibile. Usa il codice manuale qui sotto.</div>';
    const i=document.getElementById("scanEan"); if(i) i.focus();
  }
}
function stopScan(){ if(scanRAF) cancelAnimationFrame(scanRAF); scanRAF=null; if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } scanBusy=false; }
function closeScan(){ stopScan(); const ov=document.getElementById("scanOv"); if(ov) ov.remove(); scanResult=null; }
async function lookup(ean){
  ean=(ean||"").trim(); const msg=document.getElementById("scanMsg");
  if(!/^\d{8,14}$/.test(ean)){ if(msg) msg.textContent="Codice non valido (servono 8–14 cifre)."; return; }
  stopScan();
  if(msg) msg.textContent="Cerco "+ean+"…";
  try{
    const r=await fetch("https://world.openfoodfacts.org/api/v2/product/"+ean+".json?fields=product_name,brands,nutriments,product_quantity,nutriscore_grade,nova_group");
    const d=parseOFF(await r.json());
    if(!d){ if(msg) msg.innerHTML="Prodotto non trovato su Open Food Facts.<br>Puoi aggiungerlo a mano in Dispensa o in Lista."; return; }
    showResult(d, ean);
  }catch(e){ if(msg) msg.textContent="Errore di rete: controlla la connessione."; }
}
function showResult(d, ean){
  scanResult={data:d, ean};
  const ov=document.getElementById("scanOv"); if(!ov) return;
  const mode=ov.dataset.mode, ref=ov.dataset.ref;
  const sc=document.getElementById("scanScan"); if(sc) sc.style.display="none";
  const macros=`<div class="prod-macros"><span><b class="num">${d.kcal!=null?Math.round(d.kcal):'–'}</b> kcal</span><span><b class="num">${fmt(d.p)}</b> P</span><span><b class="num">${fmt(d.c)}</b> C</span><span><b class="num">${fmt(d.f)}</b> G</span><em>/100g${d.qty?` · conf. ${d.qty}g`:''}</em></div>`;
  const actions = mode==="plan"
    ? `<button class="b fill" data-scanapply style="width:100%">Applica a ${escapeHtml(planName(ref))}</button>`
    : `<div class="wbtns"><button class="b fill flex" data-scanadd="disp">Salva + in dispensa</button><button class="b flex" data-scanadd="save">Solo salva</button></div>`;
  const res=document.getElementById("scanResult");
  res.innerHTML=`<div class="scan-res">
    <div class="scan-q-h">Vuoi aggiungere?</div>
    <div class="prod-name big">${escapeHtml(d.name||"Prodotto")}${d.brand?`<small>${escapeHtml(d.brand)}</small>`:''}</div>
    <div class="prod-badges">${nutriBadge(d.nutri)}${novaBadge(d.nova)}</div>
    ${macros}
    <div class="scan-q">${qualityNote(d)}</div>
    ${actions}
    <button class="b" data-scanagain style="width:100%;margin-top:8px;font-size:12px">↺ Scansiona un altro</button>
  </div>`;
}
/* salva un prodotto scansionato nella libreria unica (S.pantry, cat scansionato) */
function addScanned(d, ean, toDisp){
  if(!Array.isArray(S.pantry)) S.pantry=[];
  let it=S.pantry.find(p=>p.ean&&p.ean===ean);
  if(!it){ it={id:genId(), nome:d.name||"Prodotto", foodId:null, cat:"scansionato", ho:false, prezzo:0, gConf:d.qty||0, note:"", disp:false, ean}; S.pantry.push(it); }
  it.nome=d.name||it.nome||"Prodotto"; it.brand=d.brand||it.brand||""; it.nutri=d.nutri||null; it.nova=d.nova||null;
  it.m100={kcal:d.kcal,p:d.p,c:d.c,f:d.f}; if(d.qty) it.gConf=d.qty;
  if(toDisp) it.disp=true;
  save();
}

function navBadge(){
  const b=document.getElementById("navListBadge"); if(!b) return;
  const n=(S.shopping||[]).filter(x=>!x.done).length;
  if(n>0){ b.textContent=n>99?"99+":String(n); b.hidden=false; } else b.hidden=true;
}
function switchView(v){
  document.querySelectorAll(".navbtn").forEach(b=>b.setAttribute("aria-selected", b.dataset.view===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="view-"+v));
  if(v==="oggi") renderOggi();
  if(v==="preset") renderPreset();
  if(v==="spesa") renderSpesa();
  navBadge();
  window.scrollTo({top:0});
}

render();
</script>
</body>
